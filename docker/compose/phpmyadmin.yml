    phpmyadmin_${INSTANCE_NAME}:
        container_name: learnagement_phpmyadmin_${INSTANCE_NAME}
        image: phpmyadmin:5@sha256:e4b3eb5305cd42d21512bb55def2bab52625d56df927ad4ee1864a9354c84d40
        restart: always
        networks:
            - learnagement_back_${INSTANCE_NAME}
        ports:
            - ${PHPMYADMIN_PORT}:${PHPMYADMIN_DOCKER_PORT}
        environment:
            - PMA_HOST=data_mysql_${INSTANCE_NAME}
            - RELATIONA_DISPLAY=D
            - APACHE_HTTP_PORT_NUMBER=${PHPMYADMIN_DOCKER_PORT}
        volumes:
            # En lecture seule, en complément de la configuration de l'image
            - ./phpmyadmin/config.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
        depends_on:
            data_mysql_${INSTANCE_NAME}:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fs", "http://127.0.0.1:${PHPMYADMIN_DOCKER_PORT}/"]
            start_period: 10s
            interval: 30s
            timeout: 5s
            retries: 5
