name: CI

# The reusable workflows live in ion-repo (antoine-tena/ion-repo, public), cited at the ion-repo release the
# project comes from (develop): `ion repo update` moves them to the next one. The project only
# keeps its parameters here.
on:
  # Only on the way to main: a release branch. A merge into develop runs fast linters only.
  push:
    branches: [ "release/**" ]
  # Callable from another workflow of the repo.
  workflow_call:

# [WORKFLOW-PERMISSIONS]: the token reads the repo, nothing more; ion-repo's workflows need no more.
permissions:
  contents: read

jobs:
  backend:
    uses: antoine-tena/ion-repo/.github/workflows/python.yml@eb0dc112605e3ccda49cc80374ffd3185a96baf7 # develop
    with:
      directory: app/api

  # openapi.json, à la racine, suit le code de l'API (le front ne génère pas encore ses types).
  # Le job breaking compare le schéma à celui de main (la production) : une route retirée ou un
  # champ devenu obligatoire sans nouvelle version fait échouer ([FROZEN-CONTRACT]).
  api-contract:
    uses: antoine-tena/ion-repo/.github/workflows/api-contract.yml@f6340428fb1176f4ec53290ace508da3f7f49e61 # develop
    with:
      backend: app/api
      export: uv run python -m tools.export_openapi --check --output ../../openapi.json
      generate: "true"
      breaking-base: main

  # L'assistant APC (RAG), hors de l'image Dash : ruff, mypy strict, pytest.
  assistant:
    uses: antoine-tena/ion-repo/.github/workflows/python.yml@eb0dc112605e3ccda49cc80374ffd3185a96baf7 # develop
    with:
      directory: app/assistant

  # Les tableaux de bord Dash : ruff et mypy au niveau qui passe aujourd'hui (app/dashboards/
  # pyproject.toml), puis pytest (app/dashboards/tests/, sans réseau ni base) ; un job à part
  # plutôt que python.yml, qui impose mypy strict.
  dashboards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/dashboards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked --only-dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv sync --locked
      - run: uv run --no-sync mypy .
      - run: uv run --no-sync pytest

  frontend:
    uses: antoine-tena/ion-repo/.github/workflows/pnpm.yml@eb0dc112605e3ccda49cc80374ffd3185a96baf7 # develop
    with:
      scripts: |
        lint
        typecheck
        build

  # Le JavaScript de app/web/ : ESLint et Prettier (dette dans app/web/.prettierignore).
  web-js:
    uses: antoine-tena/ion-repo/.github/workflows/pnpm.yml@eb0dc112605e3ccda49cc80374ffd3185a96baf7 # develop
    with:
      directory: app/web
      scripts: |
        lint
        format:check

  # Le PHP de app/web/ : PHP-CS-Fixer et PHPStan au niveau qui passe aujourd'hui (dette dans
  # app/web/.php-cs-fixer.dist.php et app/web/phpstan-baseline.neon).
  web-php:
    runs-on: ubuntu-latest
    container: docker.io/library/composer:2
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: composer install --no-interaction --no-progress
      - run: composer audit
      - run: vendor/bin/php-cs-fixer check --show-progress=none
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress
      # Une page ne touche jamais la base : pas de fonction SQL native hors de vendor/.
      - run: "! grep -rnE --include='*.php' --exclude-dir=vendor '\\b(mysqli|mysql|pg|sqlite|odbc)_\\w+\\s*\\(' ."

  # Les couches de l'API (import-linter, contrats dans app/api/pyproject.toml).
  backend-layers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run --no-sync lint-imports --no-cache

  charter:
    uses: antoine-tena/ion-repo/.github/workflows/charter.yml@eb0dc112605e3ccda49cc80374ffd3185a96baf7 # develop

  # [SECRETS]: gitleaks searches the whole history, with no organisation licence.
  secrets-scan:
    uses: antoine-tena/ion-repo/.github/workflows/secrets.yml@eb0dc112605e3ccda49cc80374ffd3185a96baf7 # develop

  security:
    uses: antoine-tena/ion-repo/.github/workflows/security.yml@eb0dc112605e3ccda49cc80374ffd3185a96baf7 # develop
    with:
      uv: "app/api"
      pnpm: "frontend"
