name: CI

# The reusable workflows live in kiln (antoine-tena/kiln, public), cited at the kiln release the
# project comes from (develop): `kiln update` moves them to the next one. The project only
# keeps its parameters here.
on:
  # Only on the way to main: a release branch. A merge into develop runs fast linters only.
  push:
    branches: [ "release/**" ]
  # Callable from another workflow of the repo.
  workflow_call:

# [WORKFLOW-PERMISSIONS]: the token reads the repo, nothing more; kiln's workflows need no more.
permissions:
  contents: read

jobs:
  backend:
    uses: antoine-tena/kiln/.github/workflows/python.yml@develop
    with:
      directory: backend

  # Les tableaux de bord Dash : ruff et mypy au niveau qui passe aujourd'hui (dashboards/
  # pyproject.toml) ; pas encore de tests, d'où un job à part plutôt que python.yml.
  dashboards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked --only-dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv sync --locked
      - run: uv run --no-sync mypy .

  frontend:
    uses: antoine-tena/kiln/.github/workflows/pnpm.yml@develop
    with:
      scripts: |
        lint
        typecheck
        build

  charter:
    uses: antoine-tena/kiln/.github/workflows/charter.yml@develop

  # [SECRETS]: gitleaks searches the whole history, with no organisation licence.
  secrets-scan:
    uses: antoine-tena/kiln/.github/workflows/secrets.yml@develop

  security:
    uses: antoine-tena/kiln/.github/workflows/security.yml@develop
    with:
      uv: "backend"
      pnpm: "frontend"
