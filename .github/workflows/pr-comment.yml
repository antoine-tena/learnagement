name: Commentaire de PR

# Publie sur la pull request le rapport que pr-report.yml a calculé. Ce workflow a le droit
# d'écrire mais n'exécute jamais le code de la PR : il lit seulement l'artefact, comme du texte.
on:
  workflow_run:
    workflows: ["Rapport de PR"]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-report
          path: pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Commentaire
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          number="$(head -c 16 pr-report/number)"
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::Numéro de PR invalide dans l'artefact." && exit 1
          fi
          # Un seul commentaire par PR, mis à jour à chaque poussée.
          marker='<!-- learnagement-pr-report -->'
          { echo "$marker"; head -c 60000 pr-report/report.md; } > body.md
          existing="$(gh api "repos/$REPOSITORY/issues/$number/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$existing" -F body=@body.md >/dev/null
          else
            gh pr comment "$number" --repo "$REPOSITORY" --body-file body.md
          fi
