version: 2
updates:
  - package-ecosystem: uv
    directories:
      - "/app/api"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directories:
      - "/lab/javascript/nextjs"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "antoine-tena/ion-repo/*"
