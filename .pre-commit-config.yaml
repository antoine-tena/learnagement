# Guards and CI checks replayed before each commit.
#
# Installed once, at the root of the repo: ion repo install (or: uv tool install pre-commit &&
# pre-commit install). The hook holds for the main tree and every worktree. Replay everything:
#   pre-commit run --all-files
# Local hooks call the project's tools (uv) and `charter`, installed with ion-repo: fast linters on
# the committed files alone. Typing, tests and the CI run only when a release goes out (skill
# /repo:release), never at a push to develop.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # [NO-COMMIT-ON-MAIN]: refuses any commit made on main and on the integration branches
      # (`develop`, or those of `ion repo set protected_branches=…`). GitHub also refuses a
      # force-push of develop and any push on main (rulesets).
      - id: no-commit-to-branch
        args: [--branch, main, --branch, dev, --branch, prerelease]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        # The pnpm lockfile holds several YAML documents.
        args: [--allow-multiple-documents]
      - id: check-json

  - repo: local
    hooks:
      - id: ruff-check-app/api
        name: ruff check (app/api)
        entry: bash -c 'cd app/api && uv run ruff check --fix --force-exclude "${@#app/api/}"' --
        language: system
        types: [python]
        files: ^app/api/

      - id: ruff-format-app/api
        name: ruff format (app/api)
        entry: bash -c 'cd app/api && uv run ruff format --force-exclude "${@#app/api/}"' --
        language: system
        types: [python]
        files: ^app/api/

      - id: ruff-check-launcher
        name: ruff check (launcher)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^(launcher/|Learnagement\.py$|bootstrap\.py$)

      - id: ruff-format-launcher
        name: ruff format (launcher)
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        files: ^(launcher/|Learnagement\.py$|bootstrap\.py$)

      - id: ruff-check-importers
        name: ruff check (app/importers)
        entry: bash -c 'cd app/importers && uv run ruff check --fix --force-exclude "${@#app/importers/}"' --
        language: system
        types: [python]
        files: ^app/importers/

      - id: ruff-format-importers
        name: ruff format (app/importers)
        entry: bash -c 'cd app/importers && uv run ruff format --force-exclude "${@#app/importers/}"' --
        language: system
        types: [python]
        files: ^app/importers/

      - id: ruff-check-assistant
        name: ruff check (app/assistant)
        entry: bash -c 'cd app/assistant && uv run ruff check --fix --force-exclude "${@#app/assistant/}"' --
        language: system
        types: [python]
        files: ^app/assistant/

      - id: ruff-format-assistant
        name: ruff format (app/assistant)
        entry: bash -c 'cd app/assistant && uv run ruff format --force-exclude "${@#app/assistant/}"' --
        language: system
        types: [python]
        files: ^app/assistant/

      - id: ruff-check-dashboards
        name: ruff check (app/dashboards)
        entry: bash -c 'cd app/dashboards && uv run ruff check --fix --force-exclude "${@#app/dashboards/}"' --
        language: system
        types: [python]
        files: ^app/dashboards/

      - id: ruff-format-dashboards
        name: ruff format (app/dashboards)
        entry: bash -c 'cd app/dashboards && uv run ruff format --force-exclude "${@#app/dashboards/}"' --
        language: system
        types: [python]
        files: ^app/dashboards/

      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && pnpm exec eslint --fix "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(vue|ts|tsx|mjs)$

      # app/web/ : le PHP par app/web/tools/run.sh (le PHP de la machine, sinon podman), le JavaScript
      # par pnpm ; les règles et leur dette sont dans les fichiers de configuration de app/web/.
      - id: php-cs-fixer-web
        name: php-cs-fixer (web)
        entry: bash -c 'app/web/tools/run.sh vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --show-progress=none --path-mode=intersection "${@#app/web/}"' --
        language: system
        types: [php]
        files: ^app/web/

      - id: phpstan-web
        name: phpstan (web)
        entry: bash -c 'app/web/tools/run.sh vendor/bin/phpstan analyse --no-progress --memory-limit=1G "${@#app/web/}"' --
        language: system
        types: [php]
        files: ^app/web/
        exclude: ^app/web/(vendor|tools)/

      # Les couches : tout le graphe, relu dès qu'un fichier de la couche change.
      - id: deptrac-web
        name: deptrac (web)
        entry: app/web/tools/run.sh vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress
        language: system
        types: [php]
        files: ^app/web/
        pass_filenames: false

      - id: no-sql-web
        name: pas de SQL dans app/web/ (l'API seule lit la base)
        entry: '\b(mysqli|mysql|pg|sqlite|odbc)_\w+\s*\('
        language: pygrep
        types: [php]
        files: ^app/web/
        exclude: ^app/web/vendor/

      - id: lint-imports-api
        name: import-linter (app/api)
        entry: bash -c 'cd app/api && uv run lint-imports --no-cache' --
        language: system
        types: [python]
        files: ^app/api/
        pass_filenames: false

      # openapi.json réécrit d'après le code : un changement de route s'y voit dans la PR.
      - id: openapi-api
        name: openapi.json (app/api)
        entry: bash -c 'cd app/api && uv run python -m tools.export_openapi --output ../../openapi.json >/dev/null' --
        language: system
        types: [python]
        files: ^app/api/
        exclude: ^app/api/tests/
        pass_filenames: false

      - id: eslint-web
        name: eslint (web)
        entry: bash -c 'cd app/web && { [ -d node_modules ] || pnpm install --frozen-lockfile --silent; } && pnpm exec eslint --fix "${@#app/web/}"' --
        language: system
        types: [javascript]
        files: ^app/web/

      - id: prettier-web
        name: prettier (web)
        entry: bash -c 'cd app/web && { [ -d node_modules ] || pnpm install --frozen-lockfile --silent; } && pnpm exec prettier --write --ignore-unknown "${@#app/web/}"' --
        language: system
        types: [javascript]
        files: ^app/web/

      - id: charter
        name: charter (charter.toml, committed files)
        entry: charter file
        language: system
