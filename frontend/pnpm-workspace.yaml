# Install scripts of dependencies: refused, prebuilt binaries are enough.
allowBuilds:
  sharp: false
  unrs-resolver: false

# Exact versions in package.json, even after `ion repo update` ([LOCKED-DEPENDENCIES]).
saveExact: true

# Patched transitive versions the parents do not require yet (pnpm audit).
overrides:
  postcss-selector-parser@<6.1.5: ^6.1.5
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
