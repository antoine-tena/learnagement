[project]
name = "learnagement-assistant"
version = "0.1.0"
description = "L'assistant APC de Learnagement : recherche par le sens dans les PDF des formations."
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu==1.15.1",
    "numpy==2.5.4",
    "pymupdf==2.1",
    "sentence-transformers==6.1.0",
    "torch==2.15.0",
]

[project.scripts]
learnagement-assistant-chunks = "learnagement_assistant.build_chunks:main"
learnagement-assistant-index = "learnagement_assistant.build_index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnagement_assistant"]

# torch en version CPU : la version par défaut tire CUDA, plusieurs Go inutiles sur le serveur.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# Les types de PyMuPDF sont partiels (fonctions non annotées) : mypy le lit comme non typé.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
