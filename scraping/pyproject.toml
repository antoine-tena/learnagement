[project]
name = "learnagement-scraping"
version = "0.1.0"
description = "Imports de Learnagement depuis l'intranet de Polytech et les services de l'USMB."
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "click==8.5.0",
    "lxml==6.1.3",
    "mysql-connector-python==26.10.0",
    "python-dotenv==1.2.4",
    "selenium==4.52.0",
]

[project.scripts]
learnagement-scraping = "learnagement_scraping.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnagement_scraping"]

[dependency-groups]
dev = [
    "lxml-stubs==0.5.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "types-beautifulsoup4==4.12.0.20250516",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
