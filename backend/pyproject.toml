[project]
name = "learnagement-backend"
version = "0.1.0"
description = "API FastAPI de Learnagement."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "mysql-connector-python==26.7.0",
    "openpyxl==3.1.5",
    "pwdlib[bcrypt]==0.3.1",
    "pydantic==2.14.1",
    "pyjwt==2.15.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.4",
    "sqlglot==30.22.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.2,<0.18.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]
