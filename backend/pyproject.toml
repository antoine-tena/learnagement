[project]
name = "learnagement-backend"
version = "0.1.0"
description = "API FastAPI de Learnagement."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "mysql-connector-python==26.7.0",
    "openpyxl==3.1.5",
    "pwdlib[bcrypt]==0.3.1",
    "pydantic==2.14.1",
    "pyjwt==2.15.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.4",
    "sqlglot==30.22.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.16,<3.0.0",
    "mypy>=2.4.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.2,<0.18.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true

# La dette d'aujourd'hui : ces modules ont des erreurs de type de ces codes ; un module quitte
# la liste une fois corrigé.
[[tool.mypy.overrides]]
module = [
    "access_control.checker",
    "access_control.predicates",
    "access_control.responsibilities",
    "access_control.rules",
    "access_control.types",
    "api.dependencies.auth_deps",
    "api.dependencies.user_loader",
    "api.route_factory",
    "app",
    "auth.authenticate_cas.service",
    "auth.authenticate_lnm",
    "auth.authenticate_tools",
    "db.connection",
    "domains.lnm_etudiant.student_internships",
    "domains.lnm_etudiant.students_list",
    "domains.lnm_evaluation._db",
    "domains.lnm_mobility_assignment._db",
    "domains.lnm_mobility_assignment.algorithm",
    "domains.lnm_mobility_assignment.queries",
    "domains.lnm_university._db",
    "domains.lnm_university.catalog_admin",
    "domains.lnm_university.exports_diagnostics",
    "domains.lnm_university.exports_places",
    "domains.lnm_university.exports_status",
    "domains.lnm_university.exports_wishes",
    "domains.lnm_university.wishes",
    "domains.maquette_module._db",
    "init.introspection",
    "init.queries",
    "models.request",
    "models.user",
    "repositories.lnm_filiere_requests",
    "system.access_auth.routes",
    "system.access_auth.sqlglot_lineage",
    "system.access_auth.tree",
    "system.check.routes",
    "system.tools",
    "tests.test_access_control_responsibilities",
    "tests.test_access_control_rules",
    "tests.test_authenticate_cas",
    "tests.test_db_transaction",
    "tests.test_module_ownership_dependencies",
    "tests.test_module_ownership_matrix",
    "tests.test_module_ownership_resources",
    "tests.test_university_subscript",
]
disable_error_code = ["arg-type", "assignment", "attr-defined", "comparison-overlap", "dict-item", "import-untyped", "index", "misc", "no-any-return", "no-untyped-call", "operator", "return-value", "type-arg", "union-attr", "var-annotated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

# Les couches, vérifiées par import-linter (uv run lint-imports) : une couche n'importe que celles
# du dessous. ignore_imports : la dette d'aujourd'hui, un import quitte la liste une fois corrigé.
[tool.importlinter]
root_packages = [
    "access_control", "api", "auth", "core", "db", "domains", "init", "models", "repositories",
    "system",
]

[[tool.importlinter.contracts]]
name = "Couches du backend"
type = "layers"
layers = [
    "domains | system",
    "auth.authenticate_lnm | auth.authenticate_cas",
    "api",
    "auth.authenticate_tools | access_control",
    "repositories",
    "db | init",
    "core | models",
]
ignore_imports = [
    # Import différé dans la fonction pour éviter un cycle : db_request descend dans db/.
    "access_control.predicates -> api.dependencies",
]

# Un domaine ne lit pas les requêtes d'un autre : il passe par le service de ce domaine.
[[tool.importlinter.contracts]]
name = "Domaines indépendants"
type = "independence"
modules = ["domains.*"]
