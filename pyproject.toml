[project]
name = "learnagement"
version = "0.1.0"
description = "Le lanceur de Learnagement."
requires-python = ">=3.12"
dependencies = [
    "click==8.5.0",
    "click-default-group==1.2.4",
    "cryptography==50.0.2",
    "pwdlib[bcrypt]==0.3.1",
    "python-dotenv==1.2.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"launcher/tests/*" = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["launcher/tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]
