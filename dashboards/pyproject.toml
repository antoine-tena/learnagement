[project]
name = "learnagement-dashboards"
version = "0.1.0"
description = "Les tableaux de bord Dash de Learnagement."
requires-python = ">=3.14"
dependencies = [
    "dash==4.4.1",
    "dash-bootstrap-components==2.0.4",
    "dash-flows==1.3.0",
    "dash-leaflet==1.1.3",
    "flask-session==0.8.0",
    "geopy==2.5.0",
    "gunicorn==26.2.0",
    "matplotlib==3.11.2",
    "networkx==3.7",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "pydot==4.0.1",
    "pyjwt==2.15.1",
    "pymupdf==2.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
# La dette d'aujourd'hui, règle par règle : une règle quitte la liste quand sa dernière
# infraction est corrigée, et n'y revient jamais.
ignore = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN206",
    "B007",
    "B905",
    "E501",
    "E711",
    "E722",
    "E741",
    "F401",
    "F402",
    "F541",
    "F811",
    "F841",
    "I001",
    "N802",
    "N803",
    "N806",
    "RUF001",
    "RUF002",
    "RUF005",
    "RUF010",
    "RUF015",
    "RUF022",
    "RUF034",
    "RUF059",
    "SIM102",
    "SIM108",
    "SIM118",
    "UP015",
]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
ignore_missing_imports = true

# La dette d'aujourd'hui : ces modules ont des erreurs de type de ces codes ; un module quitte
# la liste une fois corrigé. Le typage strict viendra module par module (phase C).
[[tool.mypy.overrides]]
module = [
    "apc_dash.apc20_chatbot",
    "apc_dash.apc20_layout",
    "pages.stages_administratif",
    "pages.stages_administratif.*",
    "main",
]
disable_error_code = ["arg-type", "attr-defined", "var-annotated"]
