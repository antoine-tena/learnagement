<VirtualHost *:80>
    DocumentRoot /var/www/html

    # Configuration spécifique pour APP_2026
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    # Aucun fichier caché servi : le .env de l'instance est à la racine, lu par config.php.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
